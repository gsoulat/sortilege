[project]
name = "sortilege"
version = "0.1.0"
description = "Range automatiquement une bibliotheque video : identifie, renomme, deplace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
# Resolveur IA — installe seulement si SORTILEGE_AI_ENABLED=true
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sortilege"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# S101 = assert, autorise dans les tests
per-file-ignores = { "tests/*" = ["S101"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
