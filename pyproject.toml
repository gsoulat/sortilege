[project]
name = "sortilege"
version = "0.5.0"
description = "Range automatiquement une bibliotheque video : identifie, renomme, deplace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
# Resolveur IA — installe seulement si SORTILEGE_AI_ENABLED=true
ai = ["anthropic>=0.40"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",       # requis par fastapi.testclient
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sortilege"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Dans les tests : assert (S101), faux secrets (S105/S106), /tmp (S108) sont
# des fixtures, pas des vulnerabilites. Les memes regles restent actives sur le
# code applicatif, ou elles ont un sens.
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- Versionnage automatique depuis les commits conventionnels ---------------
# feat: -> mineure · fix: -> patch · BREAKING CHANGE -> majeure
# Le tag declenche la publication de l'image Docker (voir release.yml).
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sortilege/__init__.py:__version__"]
commit_message = "chore(release): v{version} [skip ci]"
# Rien a construire : l'artefact est l'image Docker, pas un paquet PyPI.
build_command = ""
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):", "^chore: bump"]

[tool.semantic_release.publish]
upload_to_vcs_release = true
