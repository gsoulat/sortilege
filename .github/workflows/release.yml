name: Release

on:
  push:
    branches: [main]
  # Rattrapage manuel : reconstruit et republie l'image du dernier tag sans
  # retoucher aux versions.
  workflow_dispatch:

# Deux releases simultanees produiraient deux tags concurrents.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version semantique et publication de l'image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creer le tag et la release
      packages: write   # publier sur ghcr.io
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # semantic-release lit tout l'historique
          token: ${{ secrets.GITHUB_TOKEN }}

      # Version calculee, fichiers modifies, commit et tag faits EN LOCAL.
      # Rien n'est pousse ici : la poussee depuis le runner echoue par
      # intermittence cote GitHub (« remote: fatal error in commit_refs »), et
      # tant qu'elle vivait dans cette etape son echec emportait tout le reste,
      # y compris l'image — le seul artefact reellement deployable.
      - name: Determiner la version depuis les commits
        id: release
        if: github.event_name == 'push'
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"
          vcs_release: "false"

      # Une seule variable decide de la suite, qu'on vienne d'un push ou d'un
      # rattrapage manuel : sans elle, chaque etape suivante devrait connaitre
      # les deux cas.
      - name: Version a publier
        id: target
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest=$(git describe --tags --abbrev=0 | sed 's/^v//')
            echo "version=$latest" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Rattrapage : republication de la version $latest"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucune version a publier."
          fi

      # --- Image Docker ------------------------------------------------------
      #
      # AVANT la poussee git, deliberement. L'image se construit depuis l'arbre
      # de travail, qui porte deja la version bumpee. Un incident cote GitHub
      # sur la poussee des refs ne coute donc plus l'image : c'est elle qu'on
      # deploie, et la refaire coute un build multi-architecture complet.

      - uses: docker/setup-qemu-action@v3
        if: steps.target.outputs.publish == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.publish == 'true'

      - name: Connexion a GHCR
        if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadonnees de l'image
        if: steps.target.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }}
            type=raw,value=latest

      - name: Construire et publier
        if: steps.target.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 inclus : les NAS Asustor et Synology recents sont en ARM.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Poussee des refs --------------------------------------------------

      - name: Pousser le commit de version et son tag
        id: push
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Le build Docker tourne en root et laisse des objets lui appartenant
          # dans .git : sans cela git echoue sur « insufficient permission for
          # adding an object ». C'est le prix de construire l'image AVANT de
          # pousser, et cet ordre reste le bon : l'image est le seul artefact
          # deployable, un incident git ne doit pas la couter.
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/.git" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Les deux refs sont nommees explicitement et poussees ATOMIQUEMENT :
          # ensemble ou pas du tout. Un tag arrive sans sa branche fige toutes
          # les releases suivantes — semantic-release voit la version comme
          # deja publiee et ne publie plus rien, en vert.
          #
          # AUCUN REBASE ICI, et c'est deliberé. Le rattrapage par rebase a ete
          # essaye : il reecrit le commit de version, ce qui orpheline le tag
          # pose dessus, et il entre en conflit sur le CHANGELOG — un fichier
          # genere, que rejouer n'a aucun sens. Il transformait un echec franc
          # en echec silencieux.
          #
          # Les tentatives ne servent donc qu'aux erreurs vraiment transitoires
          # du serveur. Une branche qui a bouge est un cas pour un humain, avec
          # une commande claire, pas pour une resolution automatique hasardeuse.
          for attempt in 1 2 3; do
            if git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::poussee refusee (tentative $attempt/3)"
            sleep $((attempt * 5))
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publier la release GitHub
        if: steps.push.outputs.pushed == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      # Le job ne doit pas passer au vert quand le depot n'a pas recu son tag :
      # la meme version serait recalculee au commit suivant, sans qu'on
      # comprenne pourquoi elle n'a pas bouge.
      - name: Signaler une poussee impossible
        if: steps.release.outputs.released == 'true' && steps.push.outputs.pushed != 'true'
        run: |
          echo "::error::Image ${{ steps.target.outputs.version }} publiee sur GHCR," \
               "mais le commit de version et le tag n'ont pas pu etre pousses." \
               "Cause la plus frequente : une poussee manuelle pendant la release." \
               "Rattrapage depuis un poste : git pull --rebase origin main," \
               "git tag -a ${{ steps.release.outputs.tag }} -m ${{ steps.release.outputs.tag }}," \
               "git push --atomic origin main refs/tags/${{ steps.release.outputs.tag }}"
          exit 1
