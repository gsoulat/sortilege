name: Release

on:
  push:
    branches: [main]
  # Rattrapage manuel : reconstruit et republie l'image du dernier tag sans
  # retoucher aux versions.
  workflow_dispatch:

# Deux releases simultanees produiraient deux tags concurrents.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version semantique et publication de l'image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creer le tag et la release
      packages: write   # publier sur ghcr.io
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # semantic-release lit tout l'historique
          token: ${{ secrets.GITHUB_TOKEN }}

      # Version calculee, fichiers modifies, commit et tag faits EN LOCAL.
      # Rien n'est pousse ici : la poussee depuis le runner echoue par
      # intermittence cote GitHub (« remote: fatal error in commit_refs »), et
      # tant qu'elle vivait dans cette etape son echec emportait tout le reste,
      # y compris l'image — le seul artefact reellement deployable.
      - name: Determiner la version depuis les commits
        id: release
        if: github.event_name == 'push'
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"
          vcs_release: "false"

      # Une seule variable decide de la suite, qu'on vienne d'un push ou d'un
      # rattrapage manuel : sans elle, chaque etape suivante devrait connaitre
      # les deux cas.
      - name: Version a publier
        id: target
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest=$(git describe --tags --abbrev=0 | sed 's/^v//')
            echo "version=$latest" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Rattrapage : republication de la version $latest"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucune version a publier."
          fi

      # --- Image Docker ------------------------------------------------------
      #
      # AVANT la poussee git, deliberement. L'image se construit depuis l'arbre
      # de travail, qui porte deja la version bumpee. Un incident cote GitHub
      # sur la poussee des refs ne coute donc plus l'image : c'est elle qu'on
      # deploie, et la refaire coute un build multi-architecture complet.

      - uses: docker/setup-qemu-action@v3
        if: steps.target.outputs.publish == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.publish == 'true'

      - name: Connexion a GHCR
        if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadonnees de l'image
        if: steps.target.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }}
            type=raw,value=latest

      - name: Construire et publier
        if: steps.target.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 inclus : les NAS Asustor et Synology recents sont en ARM.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Poussee des refs --------------------------------------------------

      - name: Pousser le commit de version et son tag
        id: push
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        run: |
          # --atomic est ESSENTIEL, pas une precaution de style. Sans lui,
          # GitHub a accepte refs/tags/v0.29.0 puis refuse refs/heads/main : le
          # depot s'est retrouve avec un tag pointant hors de toute branche, et
          # semantic-release, voyant « 0.29.0 deja publiee », a cesse de
          # publier — en vert. Un echec silencieux vaut bien pire qu'un echec.
          # Avec --atomic, les deux refs partent ensemble ou aucune ne part.
          #
          # Trois tentatives espacees : l'erreur observee est transitoire cote
          # serveur, pas un refus. Une tentative unique faisait dependre la
          # release d'un alea qu'on ne controle pas.
          for attempt in 1 2 3; do
            if git push --atomic --follow-tags origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::poussee refusee (tentative $attempt/3), nouvel essai"
            sleep $((attempt * 15))
            # Un autre commit a pu arriver entre-temps : on rejoue par-dessus
            # plutot que d'ecraser.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publier la release GitHub
        if: steps.push.outputs.pushed == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      # Le job ne doit pas passer au vert quand le depot n'a pas recu son tag :
      # la meme version serait recalculee au commit suivant, sans qu'on
      # comprenne pourquoi elle n'a pas bouge.
      - name: Signaler une poussee impossible
        if: steps.release.outputs.released == 'true' && steps.push.outputs.pushed != 'true'
        run: |
          echo "::error::Image ${{ steps.target.outputs.version }} publiee sur GHCR," \
               "mais le commit de version et le tag n'ont pas pu etre pousses." \
               "Depuis un poste : git pull, puis git push --follow-tags origin main."
          exit 1
